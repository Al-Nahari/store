{% extends 'base.html' %}
{% block title %}تم استلام الطلب{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div style="font-size:4rem">✅</div>
  <h2 class="mt-3">شكراً لك! تم استلام طلبك</h2>
  <p class="lead">رقم الطلب: <strong>#{{ order.pk }}</strong></p>
  <p>الإجمالي: <strong>{{ order.total_price|floatformat:2 }} {{ CURRENCY }}</strong> — الحالة: {{ order.get_status_display }}</p>
  <a href="{% url 'store:my_orders' %}" class="btn btn-primary">عرض طلباتي</a>
  <a href="{% url 'store:home' %}" class="btn btn-outline-primary">متابعة التسوق</a>
</div>
{% endblock %}
