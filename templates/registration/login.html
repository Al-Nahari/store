{% extends 'base.html' %}
{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body">
    <h4 class="mb-3">تسجيل الدخول</h4>
    {% if form.errors %}<div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">اسم المستخدم</label>
        <input type="text" name="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">كلمة المرور</label>
        <input type="password" name="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">دخول</button>
    </form>
    <p class="mt-3 mb-0 small">ليس لديك حساب؟ <a href="{% url 'store:register' %}">أنشئ حساباً</a></p>
  </div></div>
</div></div>
{% endblock %}
